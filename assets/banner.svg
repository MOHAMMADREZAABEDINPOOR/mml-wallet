<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a03" /><stop offset="50%" stop-color="#1c1607" /><stop offset="100%" stop-color="#080602" />
    </linearGradient>
    <linearGradient id="wlNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"><animate attributeName="stop-color" values="#eab308;#ef4444;#10b981;#eab308" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#ef4444"><animate attributeName="stop-color" values="#ef4444;#f97316;#eab308;#ef4444" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#10b981"><animate attributeName="stop-color" values="#10b981;#eab308;#ef4444;#10b981" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="wlGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0" /><stop offset="100%" stop-color="#ef4444" stop-opacity="0.35" />
    </linearGradient>
    <filter id="wlGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes wlFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .floating-vault { animation: wlFloat 5.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#wlBg)" />

  <g opacity="0.6">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#eab308" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="250" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="500" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="700" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="950" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#wlGrid)" stroke-width="1.5" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#eab308" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <circle cx="200" cy="110" r="140" fill="#eab308" opacity="0.08" filter="url(#wlGlow)" />
  <circle cx="960" cy="170" r="160" fill="#ef4444" opacity="0.12" filter="url(#wlGlow)" />

  <!-- 3D Isometric Cryptographic Vault & Gold Coins -->
  <g transform="translate(940, 180)" class="floating-vault">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#wlNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
    </circle>
    <!-- Isometric Vault Outer Box -->
    <polygon points="0,-65 55,-32 0,0 -55,-32" fill="#2d2208" stroke="#eab308" stroke-width="2" filter="url(#wlGlow)" />
    <polygon points="-55,-32 0,0 0,65 -55,32" fill="#1f1705" stroke="#ef4444" stroke-width="2" />
    <polygon points="0,0 55,-32 55,32 0,65" fill="#3a2c0b" stroke="#eab308" stroke-width="2" />

    <!-- Vault Dial Wheel -->
    <circle cx="26" cy="16" r="16" fill="#141005" stroke="#eab308" stroke-width="2" />
    <circle cx="26" cy="16" r="6" fill="#ef4444" filter="url(#wlGlow)" />

    <!-- Inactive Badge -->
    <g transform="translate(-60, 45)">
      <rect x="0" y="0" width="120" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="60" y="16" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 ARCHIVED LEDGER</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="270" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#ef4444" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="2">ARCHIVED // ASYNC LEDGER BOT</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#wlNeon)" filter="url(#wlGlow)" letter-spacing="3">
      MML WALLET
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ Double-Entry Ledger, Cloud Keep-Alive Engine &amp; Flask Web DB Console
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#1c1607" stroke="#ef4444" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 Inactive Reference</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#1c1607" stroke="#eab308" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">⚡ Dual Keep-Alive</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#1c1607" stroke="#10b981" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🖥️ Flask Web DB</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#1c1607" stroke="#38bdf8" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">🗄️ aiosqlite WAL</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#wlNeon)" stroke-width="3" filter="url(#wlGlow)" />
</svg>